name: CI

# Runs only on pull requests (and manual dispatch). The PR gate already
# validates a change before it merges, so re-running the full suite on the
# merge commit to main is redundant and burns macOS minutes — `release.yml`
# re-runs the validation suite at publish time as a final sanity check.
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Build + validate
    # macos-15 ships Xcode 16 (Swift 6). macos-14 still ships Xcode 15 +
    # Swift 5.10, which can't parse `swift-tools-version: 6.0`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Shared with release.yml on purpose — see the comment in the action.
      # These two jobs used to choose independently and drifted a full two
      # minor versions apart on the same runner image.
      - uses: ./.github/actions/select-swift

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true
          uname -a

      - name: Doc mirror + assert sanity
        # These live in scripts/validate.sh, which CI does not run end to end.
        # Without them a diverged AGENTS.md or a vacuous #expect only gets
        # caught on whichever machine happens to run validate next.
        run: |
          cmp -s CLAUDE.md AGENTS.md || { echo "CLAUDE.md and AGENTS.md diverged — run: cp CLAUDE.md AGENTS.md"; exit 1; }
          if grep -rnE '#expect\((.*== *(true|false)\)|.*\?\? *(true|false)\)|.*== *Optional\()' Tests/; then
            echo "vacuous #expect form(s) — use expectTrue/expectFalse (AiTaskbarTestSupport)"; exit 1
          fi
          echo "OK"

      - name: Warnings ratchet
        # `2>&1` is load-bearing: SwiftPM writes compiler diagnostics to
        # STDOUT. An earlier version of this step sent stdout to /dev/null and
        # grepped stderr, so it reported "0 warnings" unconditionally and could
        # not fail. `scripts/warn-ratchet-selftest.sh` is the positive control —
        # run it if you change this.
        #
        # Includes test/macro/linker warnings. Only classic-Keychain
        # deprecations in its implementation and fixtures are allowlisted.
        run: |
          if ! swift build --build-tests --scratch-path "$RUNNER_TEMP/warnscratch" >"$RUNNER_TEMP/w.log" 2>&1; then
            tail -40 "$RUNNER_TEMP/w.log"
            exit 1
          fi
          scripts/check-swift-warnings.sh "$RUNNER_TEMP/w.log"

      - name: Compile (debug)
        run: swift build -c debug

      - name: Runtime validation suite
        # Mirrors the suite that `make validate` runs locally (251 assertions
        # at the time of writing) covering wire types, JSONValue, KimiConfig
        # URL whitelist, PII scrub, DiskCache TTL, AtomicFileWrite perms, etc.
        run: swift run ai-taskbar-validate

      - name: swift test + coverage gate (≥90%)
        # Enforces the policy documented in CLAUDE.md / AGENTS.md. Local
        # validate.sh runs the same script.
        run: COVERAGE_FLOOR=90 scripts/coverage.sh 90

      - name: Compile (release)
        run: swift build -c release

      - name: Universal binary smoke test
        run: |
          make app-universal
          file build/AiTaskbar.app/Contents/MacOS/ai-taskbar
          lipo -archs build/AiTaskbar.app/Contents/MacOS/ai-taskbar
          codesign --verify --deep --strict build/AiTaskbar.app
