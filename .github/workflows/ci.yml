name: CI

# Runs only on pull requests (and manual dispatch). The PR gate already
# validates a change before it merges, so re-running the full suite on the
# merge commit to main is redundant and burns macOS minutes — `release.yml`
# re-runs the validation suite at publish time as a final sanity check.
on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Build + validate
    # macos-15 ships Xcode 16 (Swift 6). macos-14 still ships Xcode 15 +
    # Swift 5.10, which can't parse `swift-tools-version: 6.0`.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Swift 6 toolchain
        # Was hard-pinned to /Applications/Xcode_16.app, which is brittle (the
        # runner image drops old Xcodes) and left CI two minor versions behind
        # the toolchain the release is actually built with locally — a bug that
        # only manifests on one of them is invisible until release day. Take
        # the newest Xcode the image offers and FAIL if it predates Swift 6,
        # rather than silently falling back to a toolchain that can't parse
        # `swift-tools-version: 6.0`.
        run: |
          latest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then echo "no Xcode found on runner"; exit 1; fi
          sudo xcode-select -s "$latest/Contents/Developer"
          major=$(swift --version 2>&1 | sed -n 's/.*Apple Swift version \([0-9]*\).*/\1/p' | head -1)
          echo "Selected $latest (Swift major: $major)"
          if [ -z "$major" ] || [ "$major" -lt 6 ]; then
            echo "need Swift 6+, got: $(swift --version 2>&1 | head -1)"; exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true
          uname -a

      - name: Doc mirror + assert sanity
        # These live in scripts/validate.sh, which CI does not run end to end.
        # Without them a diverged AGENTS.md or a vacuous #expect only gets
        # caught on whichever machine happens to run validate next.
        run: |
          cmp -s CLAUDE.md AGENTS.md || { echo "CLAUDE.md and AGENTS.md diverged — run: cp CLAUDE.md AGENTS.md"; exit 1; }
          if grep -rnE '#expect\((.*== *(true|false)\)|.*\?\? *(true|false)\)|.*== *Optional\()' Tests/; then
            echo "vacuous #expect form(s) — use expectTrue/expectFalse (AiTaskbarTestSupport)"; exit 1
          fi
          echo "OK"

      - name: Warnings ratchet
        # `2>&1` is load-bearing: SwiftPM writes compiler diagnostics to
        # STDOUT. An earlier version of this step sent stdout to /dev/null and
        # grepped stderr, so it reported "0 warnings" unconditionally and could
        # not fail. `scripts/warn-ratchet-selftest.sh` is the positive control —
        # run it if you change this.
        #
        # Everything outside the three legacy-keychain files must be clean;
        # those carry ~18 unavoidable SecKeychain/SecACL deprecations (the only
        # route to classic file-keychain ACLs, no per-call suppression exists).
        run: |
          KEYCHAIN_LEGACY='Credentials/(KeychainAccessAuthorizer|KeychainCredentialReader|KeychainPromptSuppressor)\.swift'
          swift build --build-tests --scratch-path "$RUNNER_TEMP/warnscratch" >"$RUNNER_TEMP/w.log" 2>&1 || true
          distinct=$(grep -oE "Sources/[^ ]+\.swift:[0-9]+:[0-9]+: warning:" "$RUNNER_TEMP/w.log" | sort -u || true)
          other=$(printf '%s\n' "$distinct" | grep -vE "$KEYCHAIN_LEGACY" | grep -c . || true)
          legacy=$(printf '%s\n' "$distinct" | grep -cE "$KEYCHAIN_LEGACY" || true)
          echo "allowlisted legacy-keychain warnings: ${legacy:-0}"
          if [ "${other:-0}" -gt 0 ]; then
            printf '%s\n' "$distinct" | grep -vE "$KEYCHAIN_LEGACY" | head -20
            echo "::error::${other} compiler warning(s) outside the legacy-keychain allowlist"
            exit 1
          fi
          echo "OK — no warnings outside the allowlist"

      - name: Compile (debug)
        run: swift build -c debug

      - name: Runtime validation suite
        # Mirrors the suite that `make validate` runs locally (251 assertions
        # at the time of writing) covering wire types, JSONValue, KimiConfig
        # URL whitelist, PII scrub, DiskCache TTL, AtomicFileWrite perms, etc.
        run: swift run ai-taskbar-validate

      - name: swift test + coverage gate (≥90%)
        # Enforces the policy documented in CLAUDE.md / AGENTS.md. Local
        # validate.sh runs the same script.
        run: COVERAGE_FLOOR=90 scripts/coverage.sh 90

      - name: Compile (release)
        run: swift build -c release

      - name: Universal binary smoke test
        run: |
          make app-universal
          file build/AiTaskbar.app/Contents/MacOS/ai-taskbar
          lipo -archs build/AiTaskbar.app/Contents/MacOS/ai-taskbar
          codesign --verify --deep --strict build/AiTaskbar.app
